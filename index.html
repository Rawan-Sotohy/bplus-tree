<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B+ Tree Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

            input[type="number"]:focus {
                outline: none;
                border-color: #667eea;
            }

        .button-container {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            color: white;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            }

            button:active {
                transform: translateY(0);
            }

        .btn-insert {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, #e0e0e0, transparent);
            margin: 25px 0;
        }

        .secondary-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .btn-secondary {
            padding: 12px 10px;
            font-size: 14px;
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            transition: all 0.2s;
        }

            .btn-secondary:hover {
                background: #667eea;
                color: white;
            }

        .btn-reset {
            border-color: #ff6b6b;
            color: #ff6b6b;
        }

            .btn-reset:hover {
                background: #ff6b6b;
                color: white;
            }

        .btn-visual {
            border-color: #20bf6b;
            color: #20bf6b;
        }

            .btn-visual:hover {
                background: #20bf6b;
                color: white;
            }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌳 B+ Tree Manager</h1>
        <p class="subtitle">Insert values into B+ Tree (Order 3)</p>

        <form method="POST" action="/cgi-bin/bplustree.exe">
            <div class="form-group">
                <label for="value">Enter Number:</label>
                <input type="number" id="value" name="value" placeholder="e.g., 42" required>
            </div>

            <div class="button-container">
                <button type="submit" name="action" value="insert" class="btn-insert">
                    ➕ Insert
                </button>
            </div>
        </form>

        <div class="divider"></div>

        <div class="secondary-buttons">
            <button onclick="resetTree()" class="btn-secondary btn-reset">
                🔄 Reset Tree
            </button>
            <button onclick="viewStructure()" class="btn-secondary">
                📃 View Tree Structure
            </button>
            <button onclick="visualTree()" class="btn-secondary btn-visual">
                🌳 View Visual Tree
            </button>
        </div>
    </div>

    <script>
        function resetTree() {
            if (confirm('⚠️ Are you sure you want to reset the entire tree?\nThis will delete all data!')) {
                const form = document.createElement('form');
                form.method = 'POST';
                form.action = '/cgi-bin/bplustree.exe';

                const actionInput = document.createElement('input');
                actionInput.type = 'hidden';
                actionInput.name = 'action';
                actionInput.value = 'reset';

                form.appendChild(actionInput);
                document.body.appendChild(form);
                form.submit();
            }
        }

        function viewStructure() {
            window.open('bplustree.txt', '_blank');
        }

        function visualTree() {
            window.open('tree_visual.html', '_blank');
        }
    </script>
</body>
</html>
